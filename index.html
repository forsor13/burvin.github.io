<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- MOBILE FRIENDLY -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TO MY BESTIE ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🎬 INTRO -->
<div id="intro" class="screen">
  <h1 class="intro-title">TO MY BESTIE ❤️</h1>
</div>

<!-- 🔐 LOCK -->
<div id="lock" class="screen hidden">
  <h2 class="lock-title">ENTER YOUR NAME</h2>

  <input
    id="nameInput"
    type="text"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    placeholder="type here ❤️"
  >

  <button class="enter-btn" onclick="unlock()">ENTER</button>
</div>

<!-- 🎥 MAIN -->
<div id="stage" class="hidden"></div>

<!-- 🎵 SONG 1 -->
<audio id="song" loop>
  <source src="music/song.mp3.mp3" type="audio/mpeg">
</audio>

<!-- 🎵 SONG 2 -->
<audio id="song2" loop>
  <source src="music/song2.mp3.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
